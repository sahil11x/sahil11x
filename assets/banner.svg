<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>

  <!-- Top Line -->
  <line x1="40" y1="45" x2="1240" y2="45" stroke="#00ff66" stroke-width="2"/>

  <!-- Bottom Line -->
  <line x1="40" y1="275" x2="1240" y2="275" stroke="#00ff66" stroke-width="2"/>

  <!-- Title -->
  <text x="640"
        y="120"
        text-anchor="middle"
        font-family="JetBrains Mono"
        font-size="54"
        fill="#00ff66"
        filter="url(#glow)">
        SAHIL.OS
  </text>

  <!-- Subtitle -->
  <text x="640"
        y="170"
        text-anchor="middle"
        font-family="JetBrains Mono"
        font-size="22"
        fill="#8b949e">
        Android • AI • AWS • Open Source
  </text>

  <!-- Tagline -->
  <text x="640"
        y="215"
        text-anchor="middle"
        font-family="JetBrains Mono"
        font-size="18"
        fill="#ffffff">
        Building Software That Solves Problems
  </text>

</svg>
