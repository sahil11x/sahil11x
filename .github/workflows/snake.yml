# ============================================================
# SAHIL.OS — Contribution Snake Workflow
# ------------------------------------------------------------
# Generates an animated SVG of sahil11x's contribution graph
# being "eaten" by a snake, then publishes it to the `output`
# branch so it can be embedded in README.md.
#
# Uses Platane/snk (actively maintained, not deprecated).
# Runs on a schedule, on push to main, and can be triggered
# manually from the Actions tab.
# ============================================================

name: SAHIL.OS — Generate Contribution Snake

on:
  schedule:
    # Runs once a day at 00:00 UTC to keep the snake fresh
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-snake:
    name: Build and publish snake SVG
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generate the snake SVGs (dark + light variants)
      #    Output paths are relative to the repo root and match
      #    the assets referenced from README.md.
      - name: Generate contribution snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: sahil11x
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300FF88&color_dots=%230B0F0B,%23113322,%23155c33,%2300FF88,%2339FF14
            dist/github-contribution-grid-snake.svg?color_snake=%2300FF88&color_dots=%23F5F5F5,%23c9f7dc,%2366f2ad,%2300FF88,%2339FF14

      # 3. Publish the generated SVGs to the `output` branch
      #    so they can be embedded via raw.githubusercontent.com,
      #    matching the URL already referenced in README.md
      - name: Push generated files to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          commit_message: "chore: update contribution snake [skip ci]"
          keep_files: false
